services:
  # ─── Local dev (nginx sirve el dist/ del host — no rebuild necesario) ───────
  # Uso: npm run build && docker compose up local -d
  local:
    image: nginx:1.27-alpine
    container_name: padelmvp-frontend-local
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./dist:/usr/share/nginx/html:ro
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/healthz" ]
      interval: 15s
      timeout: 5s
      retries: 3

  # ─── Production (imagen Docker self-contained, puerto 8080) ──────────────────
  # Uso: docker compose up web -d
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: padelmvp-frontend:latest
    container_name: padelmvp-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    healthcheck:
      test: [ "CMD", "wget", "-qO-", "http://127.0.0.1/healthz" ]
      interval: 30s
      timeout: 5s
      retries: 3

  # ─── Dev server Astro (hot reload) ───────────────────────────────────────────
  # Uso: docker compose up dev
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: padelmvp-frontend-dev:latest
    container_name: padelmvp-frontend-dev
    ports:
      - "4321:4321"
    volumes:
      - .:/app
      - /app/node_modules
    environment:
      - NODE_ENV=development
      - CHOKIDAR_USEPOLLING=true
    command: npm run dev -- --host 0.0.0.0
